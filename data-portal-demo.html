<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Data Portal Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: navy top bar + one fluid content column (max 1280px); each screen stacks panels that wrap to one column on phones. */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --sunk:#EEF2F5; --line:#D5DCE2; --line-2:#E3E8EC;
  --ink:#14202B; --ink-2:#4A5966; --bar:#14202B; --bar-ink:#F4F6F8; --bar-2:#C9D3DB; --bar-field:#1E2D3A; --bar-line:#3A4A58;
  --accent:#0F5F6B; --accent-ink:#FFFFFF; --accent-soft:#E3F0F2;
  --up:#1D4ED8; --up-soft:#E8EFFD; --up-muted:#AFC4EE; --down:#B4471B; --down-soft:#FBEBDD;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E161C; --surface:#152029; --sunk:#1B2833; --line:#2C3C48; --line-2:#24333E;
  --ink:#E4EBF0; --ink-2:#9DB0BD; --bar:#0A1116; --bar-ink:#E4EBF0; --bar-2:#9DB0BD; --bar-field:#152029; --bar-line:#2C3C48;
  --accent:#5FC0CC; --accent-ink:#0A1116; --accent-soft:#163940;
  --up:#7FA6F5; --up-soft:#1A2A4A; --up-muted:#34507F; --down:#F0915F; --down-soft:#3E2416; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161C; --surface:#152029; --sunk:#1B2833; --line:#2C3C48; --line-2:#24333E;
  --ink:#E4EBF0; --ink-2:#9DB0BD; --bar:#0A1116; --bar-ink:#E4EBF0; --bar-2:#9DB0BD; --bar-field:#152029; --bar-line:#2C3C48;
  --accent:#5FC0CC; --accent-ink:#0A1116; --accent-soft:#163940;
  --up:#7FA6F5; --up-soft:#1A2A4A; --up-muted:#34507F; --down:#F0915F; --down-soft:#3E2416; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2{margin:0;text-wrap:balance}
h1{font-size:28px}
h2{font-size:17px}
p{margin:0}
a{color:var(--accent)}

header{background:var(--bar);color:var(--bar-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hbar{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.logo{font-weight:700;font-size:17px;white-space:nowrap}
.logo small{font-weight:400;font-size:12px;color:var(--bar-2);margin-left:8px}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{border:0;background:transparent;color:var(--bar-2);padding:8px 12px;border-radius:8px;min-height:40px;font-size:14px}
nav button[aria-current="page"]{color:var(--bar-ink);font-weight:700;background:var(--bar-field)}
.hright{flex:1 1 260px;display:flex;justify-content:flex-end;gap:10px;align-items:center}
.hright input{flex:0 1 320px;min-width:0;height:40px;border-radius:8px;border:1px solid var(--bar-line);background:var(--bar-field);color:var(--bar-ink);padding:0 12px;font-size:14px}
.lang{display:inline-flex;border:1px solid var(--bar-line);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--bar-2);min-width:48px;height:40px;font-size:13px}
.lang button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar);font-weight:700}

main{max-width:1280px;margin:0 auto;padding:28px 16px 56px;display:flex;flex-direction:column;gap:24px}
.lede{display:flex;flex-direction:column;gap:6px}
.lede p{color:var(--ink-2)}
.notice{font-size:12.5px;color:var(--ink-2);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;align-self:flex-start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.phead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px 16px}
.meta{font-size:12.5px;color:var(--ink-2)}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.grow{flex:999 1 560px;min-width:0}
.side{flex:1 1 300px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.tile:hover{border-color:var(--accent)}
.tile b{font-size:16px}
.tile span{font-size:13.5px;color:var(--ink-2)}
.tile em{font-style:normal;font-size:12.5px;color:var(--accent)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;font-size:12.5px;color:var(--ink-2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.r{text-align:right}
.up{color:var(--up);font-weight:700}
.down{color:var(--down);font-weight:700}
.flat{color:var(--ink-2)}
tr.hl td{background:var(--up-soft)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.btn{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kv{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line-2);padding-bottom:10px;font-size:14px}
.kv:last-child{border-bottom:0;padding-bottom:0}
.kv span:last-child{color:var(--ink-2);text-align:right}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:12px;color:var(--ink-2)}
.stat b{font-size:15px}
.stat b.big{font-family:var(--f-mono);font-size:20px}
.co-pick{display:flex;flex-wrap:wrap;gap:8px}
.bars{display:flex;align-items:flex-end;gap:14px;height:220px;border-bottom:1px solid var(--line);padding:0 6px}
.bcol{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.bcol i{display:block;width:100%;max-width:64px;border-radius:6px 6px 0 0;background:var(--up-muted)}
.bcol i.last{background:var(--up)}
.bcol b{font-family:var(--f-mono);font-size:13px}
.blabels{display:flex;gap:14px;padding:0 6px}
.blabels div{flex:1 1 0;min-width:0;text-align:center;display:flex;flex-direction:column;font-size:12px;color:var(--ink-2)}
.blabels .num{color:var(--ink);font-size:12.5px}
.comment{font-size:14.5px;line-height:1.8}
.foot{margin-top:auto;border-top:1px solid var(--line-2);padding-top:12px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.datalist{display:flex;flex-wrap:wrap;gap:8px 28px;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-size:13px;color:var(--ink-2)}
.field select,.field input[type="text"]{height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:14px;min-width:0;width:100%}
.check{display:flex;gap:10px;align-items:center;font-size:14px;min-height:36px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.fresh{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.fresh.old{background:var(--down-soft);color:var(--down)}
.cobox{display:flex;flex-direction:column;gap:2px}
.cobox span{font-size:12.5px;color:var(--ink-2)}
.cell-check{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px}
.cell-check input{width:20px;height:20px;accent-color:var(--accent)}
.confirm{border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;z-index:9}
.empty{color:var(--ink-2);font-size:14px;padding:12px 0}
@media (max-width:560px){h1{font-size:23px}.hright{justify-content:flex-start}}
</style>
</head>
<body style="margin:0">

      <input id="q" type="search">

        <button id="l-ja" type="button" aria-pressed="true">日本語</button>
        <button id="l-en" type="button" aria-pressed="false">EN</button>

</header>
<main id="app" aria-live="polite"></main>

function schema(){

}

function filtered(){
  const f = S.f, lo = parseFloat(f.min), hi = parseFloat(f.max);
  return UNLISTED.map((r,i) => ({...r, i})).filter(r =>
    (f.ind === 'all' || r.ind === f.ind) && (f.reg === 'all' || r.reg === f.reg) &&
    (isNaN(lo) || r.sales >= lo) && (isNaN(hi) || r.sales <= hi) &&
    (!f.overseas || r.os) && (!f.latest || r.y === 2026)
  ).sort((a,b) => b.sales - a.sales);
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'l-ja' || b.id === 'l-en'){ S.lang = b.id === 'l-en' ? 'en' : 'ja'; try { localStorage.setItem('dp-lang', S.lang); } catch(e) {} render(); return; }
  if (b.dataset.go){ go(b.dataset.go); return; }
  if (b.dataset.use){ S.useCase = b.dataset.use; go(b.dataset.target); return; }
  if (b.dataset.co !== undefined){ S.co = +b.dataset.co; if (S.view !== 'company') go('company'); else render(); return; }
  if (b.dataset.uni){ S.universe = b.dataset.uni; render(); return; }
  if (b.dataset.field){ S.picked[b.dataset.field] = !S.picked[b.dataset.field]; render(); return; }
  if (b.dataset.del){ S.delivery = b.dataset.del; render(); return; }
  const a = b.dataset.act, L = t();
  if (a === 'pit'){ S.pit = !S.pit; render(); }
  if (a === 'sample') toast(L.sampleToast);
  if (a === 'quote'){ S.confirmQuote = true; render(); }
  if (a === 'cancel-quote'){ S.confirmQuote = false; render(); }
  if (a === 'send-quote'){ S.confirmQuote = false; render(); toast(L.quoteSent); }
  if (a === 'dl') toast(L.sampleToast);
  if (a === 'csv') toast(L.csvToast);
  if (a === 'crm'){ const n = filtered().filter(r => S.sel.has(r.i)).length; toast(n ? L.crmSent(n) : L.pickFirst); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.sel !== undefined){ const i = +el.dataset.sel; el.checked ? S.sel.add(i) : S.sel.delete(i); return; }
  if (el.dataset.f){ S.f[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; render(); const again = document.querySelector(`[data-f="${el.dataset.f}"]`); if (again && el.type !== 'checkbox') again.focus(); }
});
$('#q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = e.target.value.trim().toLowerCase(); if (!q) return;
  const i = COS.findIndex(c => c.code.includes(q) || c.ja.includes(q) || c.en.toLowerCase().includes(q));
  if (i >= 0){ S.co = i; go('company'); } else toast(S.lang === 'ja' ? '該当する銘柄がありません（デモは3銘柄のみ）' : 'No match (this demo has three companies)');
});
render();
</script>

</body>
</html>
